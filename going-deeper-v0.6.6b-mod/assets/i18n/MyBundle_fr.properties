help_army_d=Vos colons ne riposteront pas s'ils ne sont pas dans l'armée. Pour créer une armée, vous devez d'abord créer une <h> escouade </h>. Après cela, vous devez affecter des colons à une escouade. Vous pouvez donner des ordres à toute votre escouade: <h> Défendre </h> la position ou <h> Attaquer </h> l'ennemi. Si vous voulez que vos soldats acquièrent <h> compétences de combat </h> plus rapidement, prenez soin de créer des <h> casernes </h> et remplissez-les de <h> mannequins d'entraînement </h>
help_food_d=La nourriture peut être obtenue de plusieurs manières: <h> -Culture dans les fermes -Élevage de bétail -Commerce </h>. Les colons n'aiment pas vraiment les <h> aliments non transformés </h>. De plus, ils sont assez vite fatigués de la <h> même nourriture </h>
help_lazy_settlers_d=Il y a plusieurs raisons pour lesquelles vos colons ne travaillent pas: <h> -Vous n'avez activé aucun travail ou trop -Faible énergie, dépression -Faim, soif -Manque d'outils ou de ressources nécessaires </h>
help_trading_d=<h> Marchand </h> visite votre colonie tous les 2 ans. Pour échanger avec le marchand, vous devez créer un <h> Trade Depot </h> accessible au <h> marchand </h>. Vous pouvez commencer à négocier lorsque le <h> marchand </h> déballera toutes ses marchandises dans votre <h> Trade Depot </h>
help_water_d=Pour obtenir une eau de bonne qualité, vous devez d'abord construire le <h> Puits </h>. Un puits peut être construit s'il y a une <h> source d'eau souterraine </h> ci-dessous (elle est marquée par des carrés bleus). Les colons aiment boire plus au <h> baril </h> qu'au <h> puits ou rivière </h>
help_wounded_settler_d=Pour soigner un colon blessé, vous devez construire un <h> canapé médical </h>. Après cela, vous avez besoin d'un <h> Transporteur </h> qui peut transporter le colon blessé sur le divan médical. Après le transport, <h> Médical </h> prendra en charge les blessés si vous disposez des <h> fournitures médicales </h> nécessaires
