help_army_d=入植者は、軍隊に所属していない場合は反撃しません。最初に軍隊を作成するには、<h>分隊</h>を作成する必要があります。その後、入植者を分隊に割り当てる必要があります。チーム全体に命令を出すことができます：<h>防御</h>するか敵に<h>攻撃</h>出来ます。兵士に<h>戦闘スキル</h>をより早く習得させたい場合は、<h>兵舎</h>を作成し、<h>トレーニングダミー</h>で練習させてください。
help_food_d=食料はいくつかの方法で入手できます：<h>-農場で作物を育てる-畜産-取引</h>。入植者は<h>未加工食品</h>があまり好きではありません。また、彼らは<h>同じ食べ物</h>にかなり早く飽きています
help_lazy_settlers_d=入植者が働いていない理由はいくつかあります。<h>-労働を許可していない\n寝不足、エネルギー不足\nうつ病 空腹 喉の渇き\n必要なツールやリソースの不足</h>    など
help_trading_d=<h>商人</h>は2年ごとにあなたのコロニーを訪れます。商人と取引するには、<h>商人</h>がアクセスできる<h>市場</h>を構築する必要があります。 <h>商人</h>が<h>市場</h>ですべての商品を開梱すると、取引を開始できます。
help_water_d=良質の水を得るには、まず<h>井戸</h>を作る必要があります。下に<h>地下水源</h>があれば井戸を建設できます（青い四角でマークされています）。入植者は、<h>井戸や川</h>よりも<h>バレル</h>から飲むのを好みます。
help_wounded_settler_d=負傷した入植者を癒すには、<h>医療用ベッド</h>を作る必要があります。その後、<h>メディック</h>が負傷した入植者を医療用ベッドに運びます。輸送後、必要な<h>医薬品</h>があれば、<h>メディック</h>が負傷者の世話をします。
