help_army_d=Your settlers won't fight back if they are not in army. To create army firstly you need to create a <h>Squad</h>. After that you need to assign settlers to a squad. You can give orders to your whole squad: <h>Defend</h> position or <h>Attack</h> the enemy. If you want your soldiers to gain <h>combat skill</h> faster then take care of creating <h>Barracks</h> and fill them with <h>Training Dummies</h>
help_food_d=Food can be obtained in several ways:<h> -Growing crops on farms -Stock raising -Trading</h>. Settlers don't really like <h>unprocessed food</h>. Also they are getting tired of the <h>same food</h> pretty fast
help_lazy_settlers_d=There are several reasons why your settlers are not working:<h> -You enabled no labors or too much -Low energy, Depression -Hunger, Thirst -Lack of necessary tools or resources</h>
help_trading_d=<h>Merchant</h> visit your colony every 2 years. To trade with merchant you need to build <h>Trade Depot</h> that is accessible to the <h>Merchant</h>. You can start trading when the <h>Merchant</h> will unpack all his goods at your <h>Trade Depot</h>
help_water_d=To get good quality water you firstly need to build the <h>Well</h>. Well can be built if there is <h>underground water source</h> below (it is marked with blue squares). Settlers like drinking from <h>barrel</h> more than from the <h>well or river</h> 
help_wounded_settler_d=To heal wounded settler, you need to build medical <h>couch</h>. After that you need <h>Hauler</h> who can transport wounded settler to medical couch. After transportation <h>Medic</h> will take care of wounded if you have necessary <h>medical supplies</h>
