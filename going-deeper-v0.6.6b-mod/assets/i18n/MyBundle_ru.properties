help_army_d=Поселенцы не будут отбиваться от врагов, если они не служат в армии. Чтобы создать армию, для начала нужно создать <h>отряд</h>. После нужно добавить поселенцев в созданный отряд. Теперь вы сможете отдавать приказы всему вашему отряду: <h>защищать</h> позицию или <h>атаковать</h> противника. Если вы хотите, чтобы ваши солдаты быстрее нарабатывали <h>боевой опыт</h> позаботьтесь о создании <h>бараков</h> с <h>тренировочными манекенами</h>
help_food_d=Еда может быть добыта несколькими способами: <h> -Выращивание культур на ферме -Животноводство -Торговля</h>. Поселенцы недолюбливают <h>неприготовленную еду</h>. Также им довольно быстро приедается <h>одна и та же еда</h>
help_lazy_settlers_d=Может быть несколько причин, почему ваши поселенцы отлынивают:<h> -Вы назначили им слишком много профессий, либо наоборот забыли о какой-то -Поселенец устал или находится в депрессии -Поселенец голодает или испытывает жажду -Не хватает нужных инструментов и ресурсов</h>
help_trading_d=<h>Купец</h> навещает вашу колонию каждые 2 года. Чтобы торговать с <h>купцом</h>, постройте <h>рынок</h>. Вы сможете начать торговать с <h>купцом</h>, когда он разложит все свои товары на <h>рынке</h>
help_water_d=Чтобы добыть питьевую воду, постройте <h>колодец</h>. Колодец можно построить, только если под ним находится <h>подземный источник воды</h> (помечается темно-синима квадратами при строительстве). Поселенцы предпочитают пить из <h>бочек</h>, больше чем из <h>колодца или реки</h> 
help_wounded_settler_d=Чтобы вылечить раненого поселенца, нужно построить <h>больничную койку</h>. После вам понадобиться <h>носильщик</h>, который перенесёт раненого на койку. После того, как раненого поместят на койку, <h>медик</h> приступит к лечению, однако ему потребуются <h>медицинские расходники</h>
