help_army_d=Je kolonisten zullen niet terugvechten als ze niet in het leger zitten. Om een ​​leger te creëren moet je eerst een <h>Squad</h> creëren. Daarna moet je kolonisten aan een squad toewijzen. Je kunt je hele squad bevelen geven: <h>Verdedig</h> positie of <h>Val</h> de vijand aan. Als je wilt dat je soldaten sneller <h>gevechtsvaardigheden</h> krijgen, zorg dan dat je <h>Barracks</h> creëert en deze vult met <h>Training Dummies</h>
help_food_d=Voedsel kan op verschillende manieren worden verkregen:<h>-Gewassen verbouwen op boerderijen -Veeteelt -Handel</h>. Kolonisten houden niet echt van <h>onbewerkt voedsel</h>. Ook raken ze snel uitgekeken op <h>hetzelfde voedsel</h>
