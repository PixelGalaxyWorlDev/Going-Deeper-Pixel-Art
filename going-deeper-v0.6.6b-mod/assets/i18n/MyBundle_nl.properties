help_water_d=Om water van goede kwaliteit te krijgen, moet je eerst de <h>put</h> bouwen. Een put kan worden gebouwd als er een <h>ondergrondse waterbron</h> onder zit (het is gemarkeerd met blauwe vierkanten). Kolonisten drinken liever uit een <h>vat</h> dan uit de <h>put of rivier</h>.
help_wounded_settler_d=Om gewonde kolonisten te genezen, moet je een medische bank bouwen. Daarna heb je een transporteur nodig die gewonde kolonisten naar de medische bank kan vervoeren. Na het transport zal de dokter de gewonden verzorgen als je de benodigde medische benodigdheden hebt.
