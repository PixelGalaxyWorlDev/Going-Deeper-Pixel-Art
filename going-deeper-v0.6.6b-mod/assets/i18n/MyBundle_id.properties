help_army_d=Pemukim Anda tidak akan melawan jika mereka tidak menjadi tentara. Untuk membuat pasukan terlebih dahulu, Anda perlu membuat <h> Pasukan </h>. Setelah itu Anda perlu menugaskan pemukim ke sebuah regu. Anda dapat memberi perintah kepada seluruh pasukan Anda: <h> Pertahankan </h> posisi atau <h> Serang </h> musuh. Jika Anda ingin prajurit Anda memperoleh <h> keterampilan tempur </h> lebih cepat, berhati-hatilah dalam membuat <h> Barak </h> dan isi dengan <h> Training Dummies </h>
help_food_d=Makanan dapat diperoleh dengan beberapa cara: <h> -Menanam tanaman di lahan pertanian -Pemeliharaan stok -Perdagangan </h>. Pemukim tidak terlalu menyukai <h> makanan yang tidak diolah </h>. Mereka juga cepat bosan dengan <h> makanan yang sama </h>
help_lazy_settlers_d=Ada beberapa alasan mengapa pemukim Anda tidak bekerja: <h> -Anda tidak mengaktifkan tenaga kerja atau terlalu banyak -Tenaga rendah, Depresi -lapar, Haus -Kurangnya alat atau sumber daya yang diperlukan </h>
help_trading_d=<h> Pedagang </h> mengunjungi koloni Anda setiap 2 tahun. Untuk berdagang dengan pedagang, Anda perlu membangun <h> Pasar </h> yang dapat diakses oleh <h> Pedagang </h>. Anda dapat mulai berdagang ketika <h> Pedagang </h> akan membongkar semua barangnya di <h> Pasar </h> Anda
help_water_d=Untuk mendapatkan air dengan kualitas yang baik, pertama-tama Anda perlu membangun <h> Sumur </h>. Sumur dapat dibangun jika terdapat <h> sumber air bawah tanah </h> di bawahnya (ditandai dengan kotak biru). Pemukim lebih suka minum dari <h> barel </h> daripada dari <h> sumur atau sungai </h>
help_wounded_settler_d=Untuk menyembuhkan pemukim yang terluka, Anda perlu membangun <h> kasur </h> medis. Setelah itu Anda membutuhkan <h> Hauler </h> yang dapat mengangkut pemukim yang terluka ke sofa medis. Setelah transportasi, <h> Medis </h> akan merawat yang terluka jika Anda memiliki <h> persediaan medis </h> yang diperlukan
