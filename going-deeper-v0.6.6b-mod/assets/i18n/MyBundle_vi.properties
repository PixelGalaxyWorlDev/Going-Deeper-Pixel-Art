help_army_d=Những người định cư của bạn sẽ không đánh trả nếu họ không tham gia quân đội. Để tạo quân đội trước hết bạn cần tạo một <h> Squad </h>. Sau đó, bạn cần chỉ định những người định cư vào một đội. Bạn có thể ra lệnh cho toàn đội của mình: <h> Bảo vệ vị trí </h> hoặc <h> Tấn công </h> kẻ thù. Nếu bạn muốn binh lính của mình đạt được <h> kỹ năng chiến đấu </h> nhanh hơn thì hãy tạo <h> Doanh trại </h> và lấp đầy chúng bằng <h> Hình nhân huấn luyện </h>
help_food_d=Thực phẩm có thể được lấy bằng một số cách: <h> - Trồng trọt trong trang trại - Nuôi bò - Kinh doanh </h>. Người định cư không thực sự thích <h> thực phẩm chưa qua chế biến </h>. Ngoài ra, họ cũng chán ăn <h> cùng một loại thức ăn </h> khá nhanh
help_lazy_settlers_d=Có một số lý do khiến người định cư của bạn không hoạt động: <h> -Bạn không làm việc hoặc quá nhiều - Năng lượng thấp, Trầm cảm - Nóng nảy, Khát nước -Thiếu công cụ hoặc tài nguyên cần thiết </h>
help_trading_d=<h> Người bán </h> ghé thăm thuộc địa của bạn 2 năm một lần. Để giao dịch với người bán, bạn cần xây dựng <h> Trade Depot </h> mà <h> Merchant </h> có thể truy cập được. Bạn có thể bắt đầu giao dịch khi <h> Người bán </h> sẽ đóng gói tất cả hàng hóa của anh ta tại <h> Trade Depot </h> của bạn
help_water_d=Để có được nguồn nước chất lượng tốt, trước hết bạn cần xây dựng <h> Giếng </h>. Có thể xây dựng giếng nếu có <h> nguồn nước ngầm </h> bên dưới (được đánh dấu bằng ô vuông màu xanh). Những người định cư thích uống rượu từ <h> thùng </h> hơn uống từ <h> giếng hoặc sông </h>
help_wounded_settler_d=Để chữa lành cho người định cư bị thương, bạn cần xây <h> ghế dài </h> y tế. Sau đó, bạn cần <h> người vận chuyển </h>, người có thể vận chuyển người định cư bị thương đến ghế y tế. Sau khi vận chuyển <h> y tế </h> sẽ chăm sóc vết thương nếu bạn có <h> vật tư y tế cần thiết </h>
