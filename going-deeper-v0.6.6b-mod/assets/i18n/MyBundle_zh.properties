help_army_d=如果您的定居者不在军队中，他们将不进行反击。首先要创建军队，您需要创建一个<h>小队</h>。之后，您需要将定居者分配给小队。您可以命令整个小队：<h>防御</h>位置或<h>攻击</h>敌人。如果您希望您的士兵更快地获得<h>战斗技能</h>，那么请注意创建<h>军营</h>，并为他们添加<h>训练假人</h>
help_food_d=可以通过几种方式获得食物：<h>-在农场上种庄稼-畜牧业-贸易</h>。定居者并不非常喜欢<h>未经加工的食物</h>。而且他们很快就厌倦了<h>相同的食物</h>
help_lazy_settlers_d=您的定居者无法工作的原因有很多：<h>-您没有启用任何劳力或过多-精力低落，沮丧-饥饿，口渴-缺少必要的工具或资源</h>
help_trading_d=<h>商人</h>每2年访问您的殖民地一次。要与商人进行贸易，您需要建立<h>商人</h>可以访问的<h>贸易仓库</h>。您可以在<h>商人</h>在您的<h>贸易仓库</h>打开所有他的货物的包装时开始交易。
help_water_d=要获得高质量的水，您首先需要构建<h>井</h>。如果下面有<h>地下水源</h>（可以标记为蓝色方块），则可以建造油井。移居者更喜欢从<h>桶</h>喝酒，而不是从<h>井或河</h>喝酒
help_wounded_settler_d=要医治受伤的定居者，您需要建造医疗用的<h>沙发</h>。之后，您需要<h> 搬运工 </h>，他可以将受伤的定居者运送到医疗卧榻上。运输后，如果您有必要的<h>医疗用品</h>，<h>医生</h>将照顾受伤者
