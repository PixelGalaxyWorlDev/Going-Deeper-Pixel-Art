help_army_d=Deine Siedler werden sich nicht wehren, wenn sie nicht in der Armee sind. Um zuerst eine Armee zu erstellen, müssen Sie einen <h> Trupp </h> erstellen. Danach müssen Sie einem Trupp Siedler zuweisen. Sie können Ihrem gesamten Trupp Befehle erteilen: <h> Position verteidigen </h> oder <h> den Feind angreifen </h>. Wenn Sie möchten, dass Ihre Soldaten <h> schneller Kampffertigkeiten </h> erlangen, müssen Sie <h> Kasernen </h> erstellen und diese mit <h> Trainingsdummies </h> füllen
help_food_d=Lebensmittel können auf verschiedene Arten bezogen werden: <h> - Anbau von Feldfrüchten - Viehzucht - Handel </h>. Siedler mögen <h> unverarbeitetes Essen </h> nicht wirklich. Außerdem haben sie das <h> gleiche Essen </h> ziemlich schnell satt
help_lazy_settlers_d=Es gibt mehrere Gründe, warum Ihre Siedler nicht arbeiten: <h> - Sie haben keine Arbeit oder zu viel aktiviert - Niedrige Energie, Depression - Hunger, Durst - Mangel an notwendigen Werkzeugen oder Ressourcen </h>
help_trading_d=<h> Händler </h> besucht alle 2 Jahre Ihre Kolonie. Um mit Händlern zu handeln, müssen Sie ein <h> Handelsdepot </h> erstellen, auf das der <h> Händler </h> zugreifen kann. Sie können mit dem Handel beginnen, wenn der <h> Händler </h> alle seine Waren in Ihrem <h> Handelsdepot </h> auspackt
help_water_d=Um Wasser von guter Qualität zu erhalten, müssen Sie zuerst den <h> Brunnen </h> bauen. Ein Brunnen kann gebaut werden, wenn sich unten eine <h> unterirdische Wasserquelle </h> befindet (diese ist mit blauen Quadraten markiert). Siedler trinken lieber aus dem <h> Fass </h> als aus dem <h> Brunnen oder Fluss </h>
help_wounded_settler_d=Um verwundete Siedler zu heilen, müssen Sie eine medizinische <h> Couch </h> bauen. Danach brauchen Sie <h> Schlepper </h>, der den verwundeten Siedler zur medizinischen Couch transportieren kann. Nach dem Transport kümmert sich <h> Medizin </h> um Verwundete, wenn Sie <h> medizinische Versorgung </h> benötigen
