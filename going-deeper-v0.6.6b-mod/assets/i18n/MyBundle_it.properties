help_army_d=I tuoi coloni non reagiranno se non sono nell'esercito. Per creare un esercito devi prima creare una <h> Squadra </h>. Dopodiché devi assegnare i coloni a una squadra. Puoi dare ordini a tutta la tua squadra: <h> Difendi </h> posizione o <h> Attacca </h> il nemico. Se vuoi che i tuoi soldati acquisiscano <h> abilità di combattimento </h> più velocemente, occupati della creazione di <h> Caserme </h> e riempili con <h> Manichini da addestramento </h>
help_food_d=Il cibo può essere ottenuto in diversi modi: <h> -Crescere raccolti nelle fattorie -Allevamento di scorte -Commercio </h>. Ai coloni non piace molto il <h> cibo non trasformato </h>. Inoltre si stanno stancando dello <h> stesso cibo </h> abbastanza velocemente
help_lazy_settlers_d=Ci sono diversi motivi per cui i tuoi coloni non stanno lavorando: <h> -Non hai consentito fatiche o troppe -Poca energia, depressione -Fame, sete -Mancanza di strumenti o risorse necessarie </h>
help_trading_d=<h> Mercante </h> visita la tua colonia ogni 2 anni. Per fare trading con il commerciante devi creare un <h> deposito commerciale </h> accessibile al <h> commerciante </h>. Puoi iniziare a fare trading quando il <h> Mercante </h> spaccherà tutte le sue merci nel tuo <h> Deposito commerciale </h>
help_water_d=Per ottenere acqua di buona qualità devi prima costruire il <h> Pozzo </h>. Il pozzo può essere costruito se c'è una <h> fonte d'acqua sotterranea </h> sotto (è contrassegnata da quadrati blu). Ai coloni piace bere dalla <h> botte </h> più che dal <h> pozzo o fiume </h>
help_wounded_settler_d=Per curare un colono ferito, devi costruire un <h> lettino </h> medico. Dopodiché avrai bisogno di un <h> trasportatore </h> che possa trasportare i coloni feriti sul lettino medico. Dopo il trasporto, <h> Medico </h> si prenderà cura dei feriti se avrai <h> forniture mediche </h> necessarie
