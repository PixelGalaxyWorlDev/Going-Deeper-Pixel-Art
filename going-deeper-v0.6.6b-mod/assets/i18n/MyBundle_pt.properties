help_army_d=Seus colonos não lutarão se não estiverem no exército. Para criar um exército, primeiro você precisa criar um <h> Esquadrão </h>. Depois disso, você precisa atribuir colonos a um esquadrão. Você pode dar ordens a todo o seu esquadrão: <h> Defenda </h> a posição ou <h> Ataque </h> o inimigo. Se você deseja que seus soldados obtenham <h> habilidade de combate </h> mais rapidamente, cuide de criar <h> Quartel </h> e preencha-os com <h> Bonecos de treinamento </h>
help_food_d=O alimento pode ser obtido de várias maneiras: <h> -Cultivo em fazendas -Aumento de estoque-Comércio </h>. Os colonos realmente não gostam de <h> alimentos não processados ​​</h>. Além disso, eles se cansam da <h> mesma comida </h> muito rápido
help_lazy_settlers_d=Existem vários motivos pelos quais seus colonos não estão trabalhando: <h> -Você não habilitou trabalhos ou deixou de usar -Baixa energia, Depressão -Fome, Sede -Falta de ferramentas ou recursos necessários </h>
help_trading_d=<h> Comerciante </h> visita sua colônia a cada 2 anos. Para negociar com o comerciante, você precisa construir um <h> Trade Depot </h> que seja acessível ao <h> Comerciante </h>. Você pode começar a negociar quando o <h> Comerciante </h> desempacotar todas as suas mercadorias em seu <h> Depósito </h>
help_water_d=Para obter água de boa qualidade, primeiro você precisa construir o <h> Poço </h>. Poço pode ser construído se houver <h> fonte de água subterrânea </h> abaixo (está marcado com quadrados azuis). Os colonos gostam mais de beber do <h> barril </h> do que do <h> poço ou rio </h>
help_wounded_settler_d=Para curar o colono ferido, você precisa construir um <h> sofá </h> médico. Depois disso, você precisa do <h> Transportador </h> que pode transportar o colonizador ferido para o leito médico. Após o transporte, o <h> Médico </h> cuidará dos feridos se você tiver <h> suprimentos médicos </h> necessários
