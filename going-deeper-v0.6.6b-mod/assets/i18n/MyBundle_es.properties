help_army_d=Tus colonos no contraatacarán si no están en el ejército. Para crear un ejército, primero debes crear un <h> Escuadrón </h>. Después de eso, debes asignar colonos a un escuadrón. Puedes dar órdenes a todo tu escuadrón: <h> Defiende </h> posición o <h> Ataca </h> al enemigo. Si quieres que tus soldados obtengan <h> habilidades de combate </h> más rápido, crea <h> Barracones </h> y llénalos con <h> Maniquíes de entrenamiento </h>
help_food_d=Los alimentos se pueden obtener de varias formas: <h> -Cultivo de cultivos en granjas -Cultivo de ganado -Comercialización </h>. A los colonos no les gusta mucho la <h> comida sin procesar </h>. También se están cansando de la <h> misma comida </h> bastante rápido.
help_lazy_settlers_d=Hay varias razones por las que sus colonos no están trabajando: <h> -No habilitó ningún trabajo o demasiado -Baja energía, Depresión -Hambre, sed -Falta de herramientas o recursos necesarios </h>
help_trading_d=<h> Comerciante </h> visita su colonia cada 2 años. Para comerciar con un comerciante, debe construir un <h> Depósito comercial </h> que sea accesible para el <h> Comerciante </h>. Puede comenzar a comerciar cuando el <h> Comerciante </h> desempaque todas sus mercancías en su <h> Depósito comercial </h>
help_water_d=Para obtener agua de buena calidad, primero debe construir el <h> Pozo </h>. Se puede construir un pozo si hay una <h> fuente de agua subterránea </h> debajo (está marcada con cuadrados azules). A los colonos les gusta beber del <h> barril </h> más que del <h> pozo o río </h>
help_wounded_settler_d=Para curar al colono herido, necesitas construir un <h> sofá </h> médico. Después de eso, necesitas a un <h> Transportista </h> que pueda transportar al colono herido al sillón médico. Después del transporte, <h> Médico </h> se ocupará de los heridos si tiene <h> suministros médicos </h> necesarios.
