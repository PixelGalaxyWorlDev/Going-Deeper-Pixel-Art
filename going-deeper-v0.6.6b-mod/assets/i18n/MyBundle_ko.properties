help_army_d=당신의 정착민은 군대에 있지 않으면 반격하지 않을 것입니다. 먼저 군대를 만들려면 <h> 분대 </h>를 만들어야합니다. 그 후에 정착민을 분대에 배정해야합니다. 전체 분대에 명령을 내릴 수 있습니다 : <h> 방어 </h> 위치 또는 <h> 공격 </h>. 병사가 <h> 전투 기술 </h>을 더 빨리 습득하려면 <h> 병영 </h>을 만들고 <h> 훈련 인형 </h>으로 채우십시오.
help_food_d=식량은 여러 가지 방법으로 얻을 수 있습니다. <h>-농장에서 작물 재배-축산-무역 </h>. 정착민은 <h> 가공되지 않은 음식 </h>을 좋아하지 않습니다. 또한 그들은 <h> 같은 음식 </h>에 꽤 빨리 질려
help_lazy_settlers_d=당신의 정착민들이 일하지 않는 데는 몇 가지 이유가 있습니다 : <h>-노동을하지 않거나 너무 많이 활성화했습니다-낮은 에너지, 우울증-기아, 갈증-필요한 도구 나 자원 부족 </h>
help_trading_d=<h> 상인 </h>은 2 년마다 식민지를 방문합니다. 판매자와 거래하려면 <h> 판매자 </h>가 액세스 할 수있는 <h> 무역 창고 </h>를 건설해야합니다. <h> 판매자 </h>가 <h> 무역 창고 </h>에서 모든 상품의 포장을 풀면 거래를 시작할 수 있습니다.
help_water_d=좋은 수질을 얻으려면 먼저 <h> 우물 </h>을 만들어야합니다. 아래에 <h> 지하수 원 </h>이 있으면 우물을 지을 수 있습니다 (파란색 사각형으로 표시됨). 정착민은 <h> 우물이나 강 </h>보다 <h> 통 </h>에서 마시는 것을 더 좋아합니다.
help_wounded_settler_d=부상당한 정착민을 치료하려면 의료 <h> 소파 </h>를 만들어야합니다. 그 후에 부상당한 정착민을 의료용 소파로 수송 할 수있는 <h> 운반 사 </h>가 필요합니다. 수송 후 <h> 의료 용품 </h>이 필요한 경우 <h> Medic </h>에서 부상자를 치료합니다.
